<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#fff3e3;--glass:rgba(20,14,12,.8);--line:rgba(255,243,227,.14);--acc:#ffb454}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#c9481c;color:var(--cream);font-family:'Bricolage Grotesque',system-ui,sans-serif}
canvas{display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
button{font:inherit;cursor:pointer;color:inherit}
.pill{position:fixed;left:12px;top:12px;display:flex;gap:10px;align-items:center;padding:8px 18px 8px 8px;background:var(--glass);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(10px);z-index:3}
.pill img{width:40px;height:40px;border-radius:50%;background:#fff3}
.pill b{display:block;font-size:15px}.pill small{opacity:.7;font-size:12px}
nav{position:fixed;right:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:62vw;z-index:3}
nav button{width:44px;height:44px;padding:0;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px);transition:background .2s,transform .2s}
nav button img{width:24px;height:24px}
nav button:hover,nav button:focus-visible{background:#fff3e3;outline:none;transform:translateY(-2px)}
nav button:hover img,nav button:focus-visible img{filter:invert(1)}
nav button.on{background:var(--acc)}
nav button.on img{filter:invert(1)}
#hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);padding:9px 18px;border-radius:99px;font-size:13px;text-align:center;z-index:3;max-width:92vw}
#panel{position:fixed;left:14px;top:76px;bottom:64px;width:min(400px,calc(100vw - 28px));overflow:auto;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);border-radius:20px;padding:22px 24px;transform:translateX(-125%);transition:transform .35s;z-index:2}
#panel.on{transform:none}
#panel h2{margin:0 0 8px;font-size:28px;display:flex;align-items:center;gap:10px}
#panel h2 img{width:30px;height:30px}
#panel h3{margin:20px 0 8px;font-size:13px;letter-spacing:.04em;opacity:.65;font-weight:600}
#panel p,#panel li{font-size:14px;line-height:1.6;max-width:60ch}
#panel ul{padding-left:0;margin:0;list-style:none}
#panel li{padding:6px 0}
#panel a{color:var(--cream);text-decoration-color:#fff6}
#x{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;border:0;background:#fff2;font-size:16px;line-height:1}
#x:hover{background:#fff4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{display:flex;align-items:center;gap:7px;background:#fff1;border:1px solid var(--line);padding:6px 12px 6px 9px;border-radius:99px;font-size:13px}
.chips img{width:16px;height:16px;filter:invert(1)}
.slot{border:2px dashed #fff4;border-radius:14px;padding:11px 14px;margin:8px 0;font-size:14px;line-height:1.5}
.slot b{display:block;font-size:16px}
.row{display:flex;align-items:center;gap:12px;padding:9px 0}
.row img{width:36px;height:36px;border-radius:10px}
.star{display:flex;gap:10px;align-items:flex-start}.star img{width:18px;height:18px;margin-top:3px;flex:none}
#hud{position:fixed;right:14px;bottom:62px;font-size:18px;font-weight:800;text-align:right;text-shadow:0 1px 6px #0009;line-height:1.5;z-index:3}
#snake{position:fixed;inset:0;display:none;place-items:center;background:#120a07e6;z-index:5}
#snake.on{display:grid}
#snake div{background:#1d1614;border:1px solid var(--line);color:var(--cream);padding:16px;border-radius:18px;text-align:center}
#snake canvas{border-radius:10px;cursor:default}
#snake p{margin:10px 0 0;font-size:14px}
#touch{display:none}
@media (pointer:coarse){
 #touch{display:block}
 #touch button{position:fixed;width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--glass);font-size:22px;z-index:4;touch-action:none}
 #hint{bottom:80px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){#panel,nav button{transition:none}}
</style>

{

function rrShape(w, h, r) { const s = new T.Shape(), x = -w / 2, y = -h / 2; s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h); s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s; }

  car.r += (lf - rt) * 2.5 * dt * clamp(car.v / 6, -1, 1);
  car.x -= Math.sin(car.r) * car.v * dt; car.z -= Math.cos(car.r) * car.v * dt;
  for (const o of obs) { const dx = car.x - o.x, dz = car.z - o.z, d = Math.hypot(dx, dz), m = o.r + 1.8; if (d < m && d > 0) { car.x = o.x + dx / d * m; car.z = o.z + dz / d * m; car.v *= .6; } }
  const rr = Math.hypot(car.x, car.z); if (rr > 232) { car.x *= 232 / rr; car.z *= 232 / rr; car.v *= .8; }
  car.y += (groundY(car.x, car.z) - car.y) * Math.min(1, 12 * dt);
  car.g.position.set(car.x, car.y, car.z); car.g.rotation.y = car.r;
  car.steer += ((lf - rt) * .5 - car.steer) * Math.min(1, 10 * dt);
  fronts.forEach(f => f.rotation.y = car.steer); wheels.forEach(w => w.rotation.z -= car.v / .79 * dt);
  car.body.rotation.x = -car.steer * clamp(car.v / 26, -1, 1) * .12;
  car.body.position.y = Math.sin(t * 30) * .004 * Math.abs(car.v);

  /* camera */
  if (any('q')) { cs.yaw -= 1.8 * dt; cs.manual = now; } if (any('e')) { cs.yaw += 1.8 * dt; cs.manual = now; }
  if (Math.abs(car.v) > 2 && now - cs.manual > 3500) { let d = car.r - cs.yaw; d = Math.atan2(Math.sin(d), Math.cos(d)); cs.yaw += d * (1 - Math.exp(-1.8 * dt)); }
  const hd = Math.cos(cs.pitch) * cs.dist;
  want.set(car.x + Math.sin(cs.yaw) * hd, car.y + Math.sin(cs.pitch) * cs.dist + 2, car.z + Math.cos(cs.yaw) * hd);
  cam.position.lerp(want, 1 - Math.exp(-8 * dt));
  look.lerp(tmp.set(car.x - Math.sin(car.r) * 4, car.y + 2, car.z - Math.cos(car.r) * 4), 1 - Math.exp(-9 * dt)); cam.lookAt(look);
  sun.position.set(car.x - 40, 80, car.z + 30); sun.target.position.set(car.x, 0, car.z);

  /* ambient animation */
  spin.forEach(m => m.rotation.y += dt * .6);
  floaters.forEach(f => f.m.position.y = f.y0 + Math.sin(t * 1.4 + f.ph) * .28);
  clouds.rotation.y += dt * .004; window.__dust.rotation.y += dt * .01; window.__dust.position.y = Math.sin(t * .3) * 1.5;

  /* panel + nav highlight */
  const zn = zoneOf(car.x, car.z);
  if (zn !== zoneCur) {
    zoneCur = zn; panelClosed = false; const p = $('#panel');
    if (zn) { $('#pc').innerHTML = panelHTML(zn); p.scrollTop = 0; } p.classList.toggle('on', !!zn);
    for (const k in navBtns) navBtns[k].classList.toggle('on', k === zn);
  } else if (zn === 'projects' && $('#pc').dataset.n != repoList.length) { $('#pc').innerHTML = panelHTML(zn); $('#pc').dataset.n = repoList.length; }

  /* nearest interactable */
  near = null; let best = 1e9;
  for (const it of interact) { const d = Math.hypot(car.x - it.x, car.z - it.z); if (d < it.r && d < best) { best = d; near = it; } }
  interact.forEach(it => it.rm.opacity += ((it === near ? 1 : .6) - it.rm.opacity) * Math.min(1, 8 * dt));
  $('#hint').textContent = near ? `Press Enter to ${near.label}` : 'Arrow keys or WASD to drive · Drag to look around · Scroll to zoom · R resets the view';

  /* games */
  let hud = '';
  if (G.on) {
    G.items.forEach(c => c.rotation.y += dt * 3);
    G.items = G.items.filter(c => Math.hypot(car.x - c.position.x, car.z - c.position.z) < 3.2 ? (scene.remove(c), false) : true);
    if (!G.items.length) { G.on = false; G.final = (now - G.t0) / 1000; G.best = G.best ? Math.min(G.best, G.final) : G.final; }
    else hud += `Coins ${12 - G.items.length}/12 · ${((now - G.t0) / 1000).toFixed(1)}s<br>`;
  }
  if (G.final && !G.on) hud += `Coin Rush cleared in ${G.final.toFixed(1)}s · best ${G.best.toFixed(1)}s<br>`;
  if (G.started) {
    for (const p of G.pins) {
      const dx = p.x - car.x, dz = p.z - car.z, d = Math.hypot(dx, dz);
      if (d < 3 && d > .01) { const s = Math.max(Math.abs(car.v), 5) * 1.2; p.vx = dx / d * s; p.vz = dz / d * s; }
      const sp = Math.hypot(p.vx, p.vz);
      if (sp > .5) for (const q of G.pins) if (q !== p) { const ex = q.x - p.x, ez = q.z - p.z, e = Math.hypot(ex, ez); if (e < 1.7 && e > .01) { q.vx = ex / e * sp * .85; q.vz = ez / e * sp * .85; } }
      p.x += p.vx * dt; p.z += p.vz * dt; const f = Math.exp(-1.8 * dt); p.vx *= f; p.vz *= f;
      p.m.position.x = p.x; p.m.position.z = p.z; p.m.rotation.z = Math.min(1.45, Math.hypot(p.x - p.x0, p.z - p.z0) * .16);
    }
    hud += `Pins knocked ${G.pins.filter(p => Math.hypot(p.x - p.x0, p.z - p.z0) > 2.5).length}/10`;
  }
  $('#hud').innerHTML = hud;
  renderer.render(scene, cam);
}
requestAnimationFrame(tick);
}
</script>
</body>
</html>
